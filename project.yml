name: PersonalTunnel
options:
  bundleIdPrefix: com.personaltunnelapp
  developmentLanguage: ru
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TunnelCore:
    path: Packages/TunnelCore

targets:
  PersonalTunnel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: PersonalTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/PersonalTunnel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    dependencies:
      - target: PacketTunnel
      - package: TunnelCore
      - framework: Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: libsqlite3.tbd
      - sdk: SystemConfiguration.framework
      - sdk: NetworkExtension.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "Rules/**"
          - "Info.plist"
          - "*.entitlements"
      - path: PacketTunnel/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp.SingBoxPacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    dependencies:
      - package: TunnelCore
      - framework: Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: NetworkExtension.framework
      # cronet (NaiveProxy) внутри Libbox ссылается на UIApplication.
      - sdk: UIKit.framework

schemes:
  PersonalTunnel:
    build:
      targets:
        PersonalTunnel: all
    run:
      config: Debug
    archive:
      config: Release
