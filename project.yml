name: PersonalTunnel
options:
  bundleIdPrefix: com.personaltunnelapp
  developmentLanguage: ru
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TunnelKit:
    path: Packages/TunnelKit

targets:
  PersonalTunnel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PersonalTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/PersonalTunnel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    dependencies:
      - target: PacketTunnel
      - target: Widgets
      - package: TunnelKit
      - framework: Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "Rules/**"
          - "Info.plist"
          - "*.entitlements"
      - path: PacketTunnel/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp.SingBoxPacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    dependencies:
      - package: TunnelKit
      - framework: Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework

  Widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp.widget
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    dependencies:
      - package: TunnelKit

schemes:
  PersonalTunnel:
    build:
      targets:
        PersonalTunnel: all
    run:
      config: Debug
    archive:
      config: Release
