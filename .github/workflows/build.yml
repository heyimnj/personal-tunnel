name: Build

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "**.md"
      - "handoff/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # App Group профиля, которым подписывается IPA (та же, что у 1.x: данные лежат в ней).
  APP_GROUP_IDENTIFIER: group.a69e6dc9a612eb7d.1

jobs:
  core:
    name: Тесты ядра и проверка конфигураций
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Тесты TunnelCore и образцы конфигураций
        run: |
          set -euo pipefail
          docker run --rm -e ROOT="$PWD" -v "$PWD":"$PWD" -w "$PWD" swift:6.1 bash -c '
            set -euo pipefail
            swift test --package-path Packages/TunnelCore 2>&1 | tail -40
            swift run --package-path Packages/TunnelCore tunnelcore-fixtures build/fixtures "$ROOT/PacketTunnel/Rules"
          '
          sudo chown -R "$(id -u):$(id -g)" build Packages/TunnelCore/.build

      - name: Контрольные суммы списков правил
        run: cd PacketTunnel/Rules && sha256sum -c SHA256SUMS

      - name: Закрепы ядра
        id: pins
        run: echo "go=$(grep '^GO_VERSION=' core/VERSION | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Кэш проверочного ядра
        id: check-core
        uses: actions/cache@v4
        with:
          path: build/sing-box-check
          key: sing-box-check-${{ runner.os }}-${{ hashFiles('core/VERSION', 'scripts/build-check-core.sh', 'scripts/core-env.sh') }}

      - uses: actions/setup-go@v5
        if: steps.check-core.outputs.cache-hit != 'true'
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false

      - name: Сборка проверочного ядра
        if: steps.check-core.outputs.cache-hit != 'true'
        run: bash scripts/build-check-core.sh

      - name: Проверка конфигураций закреплённым sing-box
        run: |
          set -uo pipefail
          failed=0
          for file in build/fixtures/*.json; do
            if output="$(build/sing-box-check check -c "$file" 2>&1)"; then
              echo "ok   $(basename "$file")"
            else
              failed=1
              echo "FAIL $(basename "$file")"
              echo "$output" | tail -5
            fi
          done
          exit $failed

  ios:
    name: Неподписанный IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "stamp=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Закрепы ядра
        id: pins
        run: echo "go=$(grep '^GO_VERSION=' core/VERSION | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Кэш Libbox
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.arch }}-${{ steps.xcode.outputs.stamp }}-${{ hashFiles('core/VERSION', 'scripts/build-libbox.sh', 'scripts/core-env.sh') }}

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false

      - name: Сборка Libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh

      - name: Сохранить Libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.arch }}-${{ steps.xcode.outputs.stamp }}-${{ hashFiles('core/VERSION', 'scripts/build-libbox.sh', 'scripts/core-env.sh') }}

      - name: Проект Xcode
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Компиляция
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild -project PersonalTunnel.xcodeproj -scheme PersonalTunnel \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            APP_GROUP_IDENTIFIER="$APP_GROUP_IDENTIFIER" \
            PERSONAL_SOURCE_COMMIT="$(git rev-parse --short=12 HEAD)" \
            build > build/xcodebuild.log 2>&1
          status=$?
          set -e
          echo "::group::Ошибки компилятора"
          grep -E "error:|fatal error|Undefined symbol|ld: " build/xcodebuild.log | sed "s|$PWD/||" | sort -u | head -200 || true
          echo "::endgroup::"
          grep -E "warning: " build/xcodebuild.log | grep -E "App/Sources|PacketTunnel/|Packages/TunnelCore" | sed "s|$PWD/||" | sort -u | head -60 || true
          tail -5 build/xcodebuild.log
          exit $status

      - name: Упаковка IPA
        id: package
        run: |
          set -euo pipefail
          VERSION="$(grep '^MARKETING_VERSION' Config/Base.xcconfig | cut -d= -f2 | tr -d ' ')"
          BUILD="$(grep '^CURRENT_PROJECT_VERSION' Config/Base.xcconfig | cut -d= -f2 | tr -d ' ')"
          NAME="PersonalTunnel-${VERSION//./_}-${BUILD}-unsigned.ipa"
          APP="build/DerivedData/Build/Products/Release-iphoneos/PersonalTunnel.app"
          test -d "$APP/PlugIns/PacketTunnel.appex"
          test -f "$APP/PlugIns/PacketTunnel.appex/Rules/ad-block.srs"
          /usr/libexec/PlistBuddy -c "Print :AppGroupIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/PlugIns/PacketTunnel.appex/Info.plist"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && /usr/bin/ditto -c -k --keepParent Payload "../$NAME")
          shasum -a 256 "build/$NAME" > build/SHA256SUMS
          git rev-parse HEAD > build/source-commit.txt
          cp Libbox.xcframework/CORE.txt build/core.txt 2>/dev/null || cp core/VERSION build/core.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la build/*.ipa

      - name: Выложить IPA
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTunnel-unsigned-${{ github.run_number }}
          path: |
            build/${{ steps.package.outputs.name }}
            build/SHA256SUMS
            build/source-commit.txt
            build/core.txt
          if-no-files-found: error
          retention-days: 14

      - name: Выложить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
