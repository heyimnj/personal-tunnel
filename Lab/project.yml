# PTLab — весь клиент Personal Tunnel без ядра и VPN (владелец, 26.11): те же исходники и ресурсы,
# что у приложения (../App), собранные с флагом LAB. Четыре места, где приложение трогает ядро и
# системный VPN (CoreClient, TunnelController, проверки в LatencyService, CoreInfo), в Lab заменены
# имитацией из Mock/. Данные — в своей папке, группа приложения «строгая» (AppGroupStrict):
# Lab не читает и не пишет данные приложения. Кнопка с колбой открывает витрину вариантов (Sources/).
name: PTLab
options:
  bundleIdPrefix: com.personaltunnelapp
  developmentLanguage: ru
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Lab.xcconfig
  Release: Lab.xcconfig
packages:
  TunnelCore:
    path: ../Packages/TunnelCore

targets:
  PTLab:
    type: application
    platform: iOS
    sources:
      - path: ../App/Sources
      - path: ../App/Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Sources
      - path: Mock
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PTLab
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltunnelapp.lab
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconLab
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LAB
    dependencies:
      - package: TunnelCore

schemes:
  PTLab:
    build:
      targets:
        PTLab: all
    run:
      config: Debug
    archive:
      config: Release
